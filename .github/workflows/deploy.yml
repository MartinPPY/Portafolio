name: Deploy to cPanel (FTP)

# Despliegue del portafolio a https://martin-romero.cl/
# Build con Astro -> subida de ./dist vía FTP (sin cifrado) al hosting cPanel.
# NOTA: FTP plano no cifra credenciales ni contenido. Migrar a FTPS
#       (protocol: ftps) en cuanto el hosting lo permita.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy vía FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          protocol: ftp
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
