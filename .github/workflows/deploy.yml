name: Deploy to cPanel (FTPS)

# Despliegue del portafolio a https://martin-romero.cl/
# Build con Astro -> subida de ./dist vía FTPS (FTP con AUTH TLS) al hosting cPanel.
# Mismo puerto que FTP plano (21): cPanel negocia TLS con AUTH TLS sobre ese puerto.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy vía FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          protocol: ftps
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
